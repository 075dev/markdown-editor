<?xml version="1.0" encoding="UTF-8"?>
<!--
  MarkDownEditor 应用图标母版
  - 1024x1024 viewBox，圆角矩形背景
  - 渐变色：深蓝 → 紫罗兰（modern IDE 风）
  - 主体：圆角"文档"卡片 + 右上角"钢笔"剪影
  - 文档内含 3 行 markdown 占位文本（标题 / 列表 / 普通文本）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景渐变：深蓝 → 紫罗兰 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- 文档卡片渐变：白 → 浅灰 -->
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <!-- 钢笔渐变：金黄 → 橙 -->
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- 文档阴影 -->
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bg)"/>

  <!-- 文档卡片（圆角矩形，阴影） -->
  <g filter="url(#docShadow)">
    <rect x="208" y="232" width="528" height="640" rx="56" ry="56" fill="url(#doc)"/>
  </g>

  <!-- 文档左上角折角 -->
  <path d="M 208 288 L 288 232 L 736 232" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- 文档内的 markdown 占位行 -->
  <!-- 标题 -->
  <rect x="264" y="328" width="240" height="40" rx="8" fill="#1e40af"/>
  <!-- 列表 bullet -->
  <circle cx="284" cy="448" r="12" fill="#4f46e5"/>
  <rect x="312" y="436" width="336" height="24" rx="6" fill="#cbd5e1"/>
  <circle cx="284" cy="512" r="12" fill="#4f46e5"/>
  <rect x="312" y="500" width="288" height="24" rx="6" fill="#cbd5e1"/>
  <!-- 普通文本行 -->
  <rect x="264" y="588" width="416" height="20" rx="6" fill="#e2e8f0"/>
  <rect x="264" y="628" width="368" height="20" rx="6" fill="#e2e8f0"/>
  <rect x="264" y="668" width="320" height="20" rx="6" fill="#e2e8f0"/>
  <!-- code block 占位 -->
  <rect x="264" y="728" width="416" height="80" rx="8" fill="#1e293b"/>
  <rect x="284" y="748" width="160" height="10" rx="4" fill="#64748b"/>
  <rect x="284" y="766" width="240" height="10" rx="4" fill="#64748b"/>
  <rect x="284" y="784" width="180" height="10" rx="4" fill="#64748b"/>

  <!-- 钢笔：右上角斜放，与文档呼应 -->
  <g transform="translate(640 220) rotate(38)">
    <!-- 笔身 -->
    <rect x="0" y="0" width="320" height="56" rx="12" fill="url(#pen)"/>
    <!-- 笔尖 -->
    <path d="M 320 0 L 392 28 L 320 56 Z" fill="#1e293b"/>
    <!-- 笔尖金属 -->
    <path d="M 320 18 L 360 28 L 320 38 Z" fill="#94a3b8"/>
    <!-- 笔帽高光 -->
    <rect x="20" y="6" width="280" height="14" rx="7" fill="#fde68a" opacity="0.6"/>
  </g>

  <!-- 文档右下角小光晕 -->
  <circle cx="800" cy="820" r="36" fill="#ffffff" opacity="0.18"/>
</svg>