<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UML 图</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --bg-elev: #f7f7f8;
        --fg: #1a1a1a;
        --fg-muted: #6b6b6b;
        --border: #e5e5e7;
        --accent: #2563eb;
        --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --bg-elev: #161922;
          --fg: #e7e9ee;
          --fg-muted: #9aa3b2;
          --border: #232732;
          --accent: #60a5fa;
          --danger: #f87171;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 14px;
        overflow: hidden;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
      }
      .topbar__title {
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar__actions {
        display: flex;
        gap: 8px;
      }
      .topbar__btn {
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .topbar__btn:hover { background: var(--bg-elev); border-color: var(--accent); }
      .topbar__btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .stage {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
      }
      .stage:active { cursor: grabbing; }
      .stage img {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #ffffff;
        user-select: none;
        -webkit-user-drag: none;
        transform-origin: 0 0;
      }
      .error {
        margin: auto;
        padding: 24px;
        color: var(--danger);
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px;
        white-space: pre-wrap;
      }
      .toolbar {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        gap: 4px;
        padding: 4px 6px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.18);
        opacity: 0;
        transition: opacity 160ms ease;
      }
      .stage:hover .toolbar, .toolbar:focus-within { opacity: 1; }
      .toolbar__btn {
        min-width: 28px;
        height: 24px;
        padding: 0 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
      }
      .toolbar__btn:hover { background: var(--bg-elev); border-color: var(--accent); }
      .toolbar__reset {
        min-width: 56px;
        font-variant-numeric: tabular-nums;
      }
      .toolbar__hint {
        margin-left: 4px;
        padding-left: 6px;
        border-left: 1px solid var(--border);
        color: var(--fg-muted);
        font-size: 11px;
        align-self: center;
      }
      .status {
        position: absolute;
        left: 12px;
        bottom: 12px;
        color: var(--fg-muted);
        font-size: 11px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 8px;
        opacity: 0;
        transition: opacity 160ms ease;
      }
      .status.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="topbar__title" id="title">UML 图</div>
        <div class="topbar__actions">
          <button class="topbar__btn" id="copy-source" type="button" disabled>复制源码</button>
          <button class="topbar__btn" id="copy-image" type="button" disabled>复制图片</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <img id="diagram" alt="PlantUML diagram" />
        <div class="toolbar" role="toolbar" aria-label="UML 图缩放工具栏">
          <button class="toolbar__btn" id="zoom-out" type="button" aria-label="缩小">−</button>
          <button class="toolbar__btn toolbar__reset" id="zoom-reset" type="button" aria-label="重置缩放">100%</button>
          <button class="toolbar__btn" id="zoom-in" type="button" aria-label="放大">+</button>
          <span class="toolbar__hint">Ctrl+滚轮 / 双击重置</span>
        </div>
        <div class="status" id="status">已复制</div>
      </div>
    </div>
    <script type="module" src="/src/diagram-view/diagram.ts"></script>
  </body>
</html>
